name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: market_miner
          POSTGRES_PASSWORD: market_miner
          POSTGRES_DB: market_miner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U market_miner" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://market_miner:market_miner@localhost:5432/market_miner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  web:
    name: Dashboard (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t market-miner .
